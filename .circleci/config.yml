version: 2.1

# 1. Include the official AWS Orb to manage credentials automatically
orbs:
  aws-cli: circleci/aws-cli@4.1.3

jobs:
  deploy:
    docker:
      - image: cimg/aws:2023.04.1
    steps:
      - checkout
      # 2. Use the orb setup command to configure the CLI with your env variables
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY
          region: AWS_DEFAULT_REGION
      - run:
          name: Lets deploy this application
          command: |
            ls
            aws s3 sync . s3://$AWS_S3_BUCKET/

workflows:
  Production:
    jobs:
      - deploy:
          filters:
            branches:
              only: 10weeksCloudOpsChallanges
